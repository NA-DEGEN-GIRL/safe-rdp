[package]
name = "safe-rdp"
version = "0.1.0"
edition = "2024"
description = "Minimal, hardened remote desktop for Windows over Tailscale"
license = "MIT"

[dependencies.windows-sys]
version = "0.61.2"
features = [
    "Win32_Foundation",
    "Win32_Security_Cryptography",
    "Win32_Storage_Compression",
    "Win32_System_Memory",
    "Win32_System_SystemInformation",
    "Win32_System_Threading",
]

[profile.release]
lto = true
codegen-units = 1
strip = true

[profile.test]
opt-level = 2
